<toaster-container toaster-options="{'position-class': 'toast-bottom-right', 'close-button':true}"></toaster-container>
<div class="sidebar app-aside" id="sidebar" toggleable parent-active-class="app-slide-off">
  <div perfect-scrollbar wheel-propagation="false" suppress-scroll-x="true" class="sidebar-container">
    <div data-ng-include=" '/assets/views/partials/sidebar.html' "></div>
  </div>
</div>
<div class="app-content" ng-class="{loading: loading}">
  <header data-ng-include=" '/assets/views/partials/top-navbar.html' "></header>
  <div data-ng-include=" '/assets/views/partials/main-content.html' " class="main-content"></div>
</div>
<footer class="hidden-xs" data-ng-include=" '/assets/views/partials/footer.html' "></footer>
<div data-ng-include=" '/assets/views/partials/settings.html' " toggleable
  class="settings panel panel-default hidden-xs hidden-sm" id="settings"></div>
