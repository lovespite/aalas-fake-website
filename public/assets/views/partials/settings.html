<button ct-toggle="toggle" target="settings" parent-active-class="active" class="btn btn-default">
  <i class="fa fa-gear"></i>
</button>
<div class="panel-heading ng-scope">Style Selector</div>
<div class="panel-body ng-scope">
  <div class="setting-box clearfix">
    <span class="setting-title pull-left">Show-all course/exam view</span>
    <span class="setting-switch pull-right">
      <switch ng-model="app.layout.showAll" class="green"></switch>
    </span>
  </div>
  <div class="setting-box clearfix">
    <span class="setting-title pull-left">Fixed header</span>
    <span class="setting-switch pull-right">
      <switch ng-model="app.layout.isNavbarFixed" class="green"></switch>
    </span>
  </div>
  <div class="setting-box clearfix">
    <span class="setting-title pull-left">Closed sidebar</span>
    <span class="setting-switch pull-right">
      <switch ng-model="app.layout.isSidebarClosed" class="green"></switch>
    </span>
  </div>
  <div class="setting-box clearfix">
    <span class="setting-title pull-left">Fixed footer</span>
    <span class="setting-switch pull-right">
      <switch ng-model="app.layout.isFooterFixed" class="green"></switch>
    </span>
  </div>
</div>
